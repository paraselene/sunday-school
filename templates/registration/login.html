{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "登入 · 主日學點名" %}{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>{% translate "登入" %}</h1>
  <form method="post">{% csrf_token %}
    <label for="password">{% translate "密碼" %}</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">{% translate "登入" %}</button>
  </form>
</section>
{% endblock %}
