{% load static %}<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}主日學點名{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'attendance/style.css' %}">
</head>
<body>
  <header>
    <a class="brand" href="{% url 'home' %}">主日學點名</a>
    {% if user.is_authenticated %}
      <nav aria-label="主選單">
        <a href="{% url 'classes' %}">班級</a>
        <a href="{% url 'students' %}">學生</a>
        <a href="{% url 'attendance' %}">點名</a>
        <a href="{% url 'reports' %}">報表</a>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="link" type="submit">登出</button></form>
      </nav>
    {% endif %}
  </header>
  <main>
    {% for message in messages %}<p class="message {{ message.tags }}">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
